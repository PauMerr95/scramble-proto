<div class="viewer-shell" tabindex="0" #shell>
    @if (!sqv().activeRecord()) {
    <div class="empty-hint">
        No sequences stored yet. Import one with <kbd>:</kbd><code>e path/to/file.fasta</code>
    </div>
    }
    <div class="viewport-area" #area>
    <cdk-virtual-scroll-viewport
    #viewport
    [itemSize]="itemSizePx"
    [minBufferPx]="itemSizePx * 20"
    [maxBufferPx]="itemSizePx * 40"
    [autofocus]="lyt.currentFocus() === 'MainPane'"
    class="scroll-viewport">

        <app-sequence-line
            *cdkVirtualFor="let lineIdx of sqv().lineIndices(); trackBy: trackLine"
            [line]="sqv().lineAt(lineIdx)"
            [lineIndex]="lineIdx"
            [cursorOffset]="cursorOnLine(lineIdx)"
            [mode]="sqv().mode()"
            [visualSelection]="sqv().visualSelection()">
        </app-sequence-line>
    </cdk-virtual-scroll-viewport>
    <ng-content></ng-content>
    </div>

</div>
