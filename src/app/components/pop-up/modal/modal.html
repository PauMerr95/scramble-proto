@if (lyt.activeModal(); as modal) {
<div class="modal-backdrop" (click)="lyt.closeModal()">
    <div class="modal-wrapper" #modalWrapper tabindex="-1" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <span>{{ modals[modal].header }}</span>
        </div>
        <div class="modal-body">
            <router-outlet />
        </div>
    </div>
</div>
}
