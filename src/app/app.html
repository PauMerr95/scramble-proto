<div class="app-wrapper" [class.hidden]="lyt.sidePaneState() === 'Hidden'">

    <div class="navbar-port">
        <app-navbar
        (toggleSidePane)="lyt.toggleSidePane($event)"
        [activeIcon]="lyt.sidePaneState()">
        </app-navbar>
    </div>

    <div class="mainPane-port">
        <app-main-pane></app-main-pane>
    </div>

    @if (lyt.sidePaneState() !== "Hidden") {
    <div class="sidePane-port">
        <app-side-pane
        (hideSidePane)="lyt.toggleSidePane('Hidden')"
        (switchMode)="switchMode($event)">
        </app-side-pane>
    </div>
    }

    <div class="statusbar-port">
        <app-statusbar></app-statusbar>
    </div>
    
    <div class="cmdline-port">
        <app-cmd-line></app-cmd-line>
    </div>

<app-modal></app-modal>
<div class="notification-stack">
    @for (notif of this.lyt.activeNotifications(); track notif.id) {
        <app-notification [notification]="notif"></app-notification>
    }
</div>
